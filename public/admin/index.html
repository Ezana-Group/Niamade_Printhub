<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>PrintHub Africa — Content Manager</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo-mark.png" />
  </head>
  <body>
    <script>
      (async function() {
        // Automatically check if Cloudflare Access has a token ready
        try {
          const res = await fetch("/api/cms-token", { credentials: "same-origin" });
          if (res.ok) {
            const data = await res.json();
            if (data && data.ok && data.token) {
              const userObj = {
                backendName: "github",
                token: data.token,
                email: data.email || "admin@printhub.africa",
                name: (data.email || "admin").split("@")[0],
                login: (data.email || "admin").split("@")[0]
              };
              localStorage.setItem("sveltia-cms.user", JSON.stringify(userObj));
              localStorage.setItem("decap-cms-user", JSON.stringify(userObj));
              localStorage.setItem("netlify-cms-user", JSON.stringify(userObj));
            }
          }
        } catch (e) {
          // Silent fallback — Sveltia has its own built-in sign-in options
        }

        // Load modern Sveltia CMS
        const script = document.createElement("script");
        script.src = "https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js";
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
