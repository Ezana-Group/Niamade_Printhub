<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrintHub Africa — Sanity Studio</title>
  <meta http-equiv="refresh" content="0; url=https://printhub-africa.sanity.studio/">
  <script>
    // Kill any legacy service workers
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var r of regs) r.unregister();
      });
    }
    try {
      localStorage.removeItem('sveltia-cms.user');
      localStorage.removeItem('decap-cms-user');
      localStorage.removeItem('netlify-cms-user');
    } catch(e) {}

    // Instant redirect to official live Sanity Studio
    window.location.replace("https://printhub-africa.sanity.studio/");
  </script>
</head>
