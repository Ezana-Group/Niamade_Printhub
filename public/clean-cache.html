<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resetting PrintHub CMS Cache...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #334155;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { font-size: 14px; color: #94a3b8; max-width: 400px; }
    .btn {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 20px;
      background: #0284c7;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <h1 id="title">Wiping Old CMS Cache & Service Workers...</h1>
  <p id="status">Clearing background workers and cached files. Please wait a second...</p>
  <a id="btn" class="btn" style="display:none;" href="/admin/">Go to Sanity Studio</a>

  <script>
    async function resetEverything() {
      const status = document.getElementById('status');
      const title = document.getElementById('title');
      const spinner = document.getElementById('spinner');
      const btn = document.getElementById('btn');

      try {
        // 1. Unregister all service workers on printhub.africa
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (let r of regs) {
            await r.unregister();
          }
        }

        // 2. Clear all CacheStorage
        if ('caches' in window) {
          const keys = await caches.keys();
          for (let k of keys) {
            await caches.delete(k);
          }
        }

        // 3. Clear Sveltia & Decap local storage items
        try {
          localStorage.removeItem('sveltia-cms.user');
          localStorage.removeItem('decap-cms-user');
          localStorage.removeItem('netlify-cms-user');
          for (let key of Object.keys(localStorage)) {
            if (key.includes('sveltia') || key.includes('decap') || key.includes('netlify')) {
              localStorage.removeItem(key);
            }
          }
        } catch(e) {}

        title.textContent = "Done! Redirecting to Sanity Studio...";
        status.textContent = "Old Sveltia CMS worker has been completely eradicated.";

        setTimeout(() => {
          window.location.replace('/admin/?reset=' + Date.now());
        }, 1200);
      } catch (err) {
        title.textContent = "Cache cleared!";
        status.textContent = "Click below to open Sanity Studio.";
        spinner.style.display = 'none';
        btn.style.display = 'inline-block';
      }
    }

    resetEverything();
  </script>
</body>
</html>
